project_id = "scrobbler"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[functions.api]
verify_jwt = false

[auth]
enable_signup = false
additional_redirect_urls = []
site_url = "http://localhost:3000"

[auth.email]
enable_confirmations = false
max_frequency = "1m0s"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sms]
enable_confirmations = true

[storage.vector]
enabled = false
